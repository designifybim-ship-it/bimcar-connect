<script src="js/experience.js?v=202611090845"></script><div id="site-header"></div><main id="main"><div class="wrap page-head"><div class="crumbs"><a href="index.html">Home</a><span>/</span>Reviews</div><h1>Share your experience.</h1><p class="lede">Review BimCar Connect or a rental company you’ve booked with. Site reviews need a verified account; rental reviews need a completed booking.</p><label class="f review-scope">What would you like to review?<select class="input" id="review-scope"><option value="">BimCar Connect website</option></select></label></div><section class="section-tight"><div class="wrap"><div id="review-board"></div></div></section></main><div id="site-footer"></div><script src="js/data.js?v=202611090845"></script><script src="vendor/supabase-2.119.0.js"></script><script src="js/live-config.js?v=202611090845"></script><script src="js/live.js?v=202611090845"></script><script src="js/app.js?v=202611090845"></script><script src="js/chat.js?v=202611090845"></script><script src="js/reviews.js?v=202611090845"></script><script>(async()=>{await Live.ready;if(Live.failed)return;const select=document.getElementById('review-scope');for(const c of DB.companies.filter(c=>c.approved)){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.appendChild(o);}const requested=decodeURIComponent(location.hash.slice(1));if([...select.options].some(o=>o.value===requested))select.value=requested;function show(){SiteReviews.mount('#review-board',select.value||null);}select.addEventListener('change',()=>{history.replaceState(null,'',location.pathname+(select.value?'#'+encodeURIComponent(select.value):''));show();});show();})();</script></body></html>
