<script src="js/experience.js?v=202611090950"></script><div id="site-header"></div><main id="main" class="wrap section"><form class="card stack" id="reset-form" style="max-width:540px;margin:auto"><h1>Set a new password</h1><p id="reset-status" role="status">Use the link from your password-reset email.</p><label class="f">New password<span class="hint">At least 12 characters</span><span class="pw-field"><input class="input" type="password" id="new-password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false">Show</button></span></label><label class="f">Confirm new password<span class="pw-field"><input class="input" type="password" id="confirm-password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false">Show</button></span></label><button class="btn btn-primary" type="submit">Save new password</button><a href="login.html">Back to login</a></form></main><div id="site-footer"></div><script src="js/data.js?v=202611090950"></script><script src="vendor/supabase-2.119.0.js"></script><script src="js/live-config.js?v=202611090950"></script><script src="js/live.js?v=202611090950"></script><script src="js/app.js?v=202611090950"></script><script src="js/chat.js?v=202611090950"></script><script>(async()=>{
const params=new URLSearchParams(location.hash.slice(1)+'&'+location.search.slice(1));
const linkError=params.get('error_description')||params.get('error');
await Live.ready;
const form=document.getElementById('reset-form'),status=document.getElementById('reset-status'),button=form.querySelector('button[type=submit]');
const passwordField=document.getElementById('new-password'),confirmationField=document.getElementById('confirm-password');
if(!Live.user){button.disabled=true;status.innerHTML=linkError?'This reset link has expired or was already used. <a href="login.html">Request a new one</a> from the login page.':'Open the password-reset link from your email to set a new password. Need a link? Use <a href="login.html">Forgot password</a> on the login page.';return;}
history.replaceState(null,'',location.pathname);
status.textContent='Choose a new password for '+Live.user.email+'.';
function validatePasswordMatch(){confirmationField.setCustomValidity(confirmationField.value&&confirmationField.value!==passwordField.value?'Passwords must match.':'');}
passwordField.addEventListener('input',validatePasswordMatch);confirmationField.addEventListener('input',validatePasswordMatch);
form.addEventListener('submit',async e=>{e.preventDefault();validatePasswordMatch();if(!form.reportValidity())return;button.disabled=true;button.classList.add('is-loading');
 try{const {error}=await Live.client.auth.updateUser({password:passwordField.value});if(error)throw error;status.textContent='Password updated. Taking you to login…';const email=Live.user.email;await Live.client.auth.signOut().catch(()=>{});location.href='login.html?reset=done&email='+encodeURIComponent(email);}
 catch(error){status.textContent=/same|different/i.test(String(error?.message))?'Choose a password you have not used before.':/weak|short|least/i.test(String(error?.message))?'That password is too weak. Use at least 12 characters.':'Unable to update your password. Request a fresh reset link and try again.';button.disabled=false;button.classList.remove('is-loading');}});
})();</script></body></html>
